name: 🔥 Hefaestus Autonomous Remediation

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '0 2 * * 1' # Runs weekly on Monday at 02:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    name: 🤖 Run Hefaestus Self-Healing Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: 📦 Install Agent Dependencies
        run: |
          cd agent
          npm ci

      - name: 🚀 Execute Hefaestus Autonomous Agent
        env:
          # Free Tier Google Gemini API Key configured in GitHub Repository Secrets
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.0-flash' }}

          # Optional OpenAI / Anthropic Keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Built-in GitHub Actions Token for pushing branch and opening PR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          EXECUTION_MODE: local
          MOCK_TARGET_DIR: ../mock-target-app
        run: |
          cd agent
          npm start
